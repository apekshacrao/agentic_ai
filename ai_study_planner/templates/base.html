<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav shell">
    <a class="brand" href="{{ url_for('dashboard') }}"><span>✦</span> StudyFlow</a>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('schedule') }}">Schedule</a>
      <a class="button small" href="{{ url_for('plan_form') }}">New plan</a>
    </div>
  </nav>
  <main class="shell">{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}{% block content %}{% endblock %}</main>
</body>
</html>
